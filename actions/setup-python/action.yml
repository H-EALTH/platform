# Composite action: Python + cache pip + install delle dipendenze di un servizio.
# Uso nei prodotti (pinnare SEMPRE il tag completo):
#   - uses: H-EALTH/platform/actions/setup-python@v1.0.0
#     with: { path: services/solver-api, libs: libs/py/or-scheduler }
name: setup-python
description: Python, cache pip e pip install per un servizio del monorepo
inputs:
  path:           { description: "Cartella del servizio, es. services/solver-api", required: true }
  python-version: { description: "Versione Python", default: "3.12" }
  libs:           { description: "Librerie interne da installare prima (path separati da spazio)", default: "" }
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.path }}/requirements*.txt
    - if: inputs.libs != ''
      shell: bash
      run: for l in ${{ inputs.libs }}; do pip install "$l"; done
    - shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
