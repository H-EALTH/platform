# ci-python — lint + test di UN servizio Python dentro un monorepo prodotto.
# Chiamato dai prodotti con `uses: H-EALTH/platform/.github/workflows/ci-python.yml@vX.Y.Z`.
# L'input `path` è ciò che lo rende compatibile col monorepo: un job per servizio toccato.
name: ci-python
on:
  workflow_call:
    inputs:
      service:        { type: string, required: true }   # es. solver-api
      path:           { type: string, required: true }   # es. services/solver-api
      python-version: { type: string, default: "3.12" }
      # Librerie interne del monorepo da installare prima del servizio (path relativi alla radice),
      # es. "libs/py/or-scheduler libs/py/contracts". Vuoto = nessuna.
      libs:           { type: string, default: "" }

jobs:
  test:
    name: ${{ inputs.service }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ inputs.python-version }}"
          cache: pip
          cache-dependency-path: "${{ inputs.path }}/requirements*.txt"
      - name: Install libs interne
        if: inputs.libs != ''
        working-directory: ${{ github.workspace }}
        run: for l in ${{ inputs.libs }}; do pip install "$l"; done
      - name: Install dipendenze
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest
      - run: ruff check . && ruff format --check .
      - run: pytest --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ inputs.service }}
          path: ${{ inputs.path }}/junit.xml
          retention-days: 90
