# ci-node — lint + test + build di UN'app web (Vite/React) dentro un monorepo prodotto.
# `lint` e `test` girano solo se lo script esiste in package.json; `build` è obbligatorio.
name: ci-node
on:
  workflow_call:
    inputs:
      path:         { type: string, required: true }    # es. apps/planner-web
      node-version: { type: string, default: "22" }

jobs:
  build:
    name: ${{ inputs.path }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: npm
          cache-dependency-path: "${{ inputs.path }}/package-lock.json"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: ${{ inputs.path }}/dist
          retention-days: 7
