# scan — verifica di sicurezza di UN componente con Trivy: segreti, misconfig del Dockerfile
# e vulnerabilità nelle dipendenze (filesystem); se `image` è dato, anche l'immagine pubblicata.
# Fallisce su CRITICAL (regola 4 della pagina Sicurezza). Non costruisce e non pubblica (ADR 0001).
# I report JSON restano come artifact `scan-<componente>` per 90 giorni: sono la prova di sicurezza
# del commit (HE-SOP-012). Un riepilogo leggibile va nel log e nel summary del run.
# Rischi accettati: <path>/.trivyignore, ogni riga con l'id CVE e il riferimento all'anomalia HE-SOP-006.
# Pinning delle action: ADR 0003.
name: scan
on:
  workflow_call:
    inputs:
      path:     { type: string, required: true }   # es. services/hello
      image:    { type: string, default: "" }      # es. ghcr.io/h-ealth/hello-web/hello@sha256:...
      severity: { type: string, default: "CRITICAL" }   # lista Trivy, es. HIGH,CRITICAL (fa fallire il job)

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v7

      - name: ".trivyignore del componente (vuoto se assente)"
        env: { P: "${{ inputs.path }}" }
        run: touch "$P/.trivyignore"

      - name: Filesystem (vuln, segreti, misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.path }}
          scanners: vuln,secret,misconfig
          severity: ${{ inputs.severity }}
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: ${{ inputs.path }}/.trivyignore
          format: json
          output: trivy-fs.json

      - if: inputs.image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Immagine pubblicata
        if: inputs.image != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image }}
          severity: ${{ inputs.severity }}
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: ${{ inputs.path }}/.trivyignore
          skip-setup-trivy: true
          format: json
          output: trivy-image.json

      - name: Riepilogo nel log e nel summary del run
        if: always()
        env:
          P:        ${{ inputs.path }}
          IMAGE:    ${{ inputs.image }}
          SEVERITY: ${{ inputs.severity }}
        run: |
          {
            echo "### scan · ${P}"
            [ -n "$IMAGE" ] && echo "immagine: \`${IMAGE}\`"
            echo "severità che fanno fallire: \`${SEVERITY}\`"
            echo
            echo "| report | vulnerabilità | segreti | misconfig |"
            echo "|---|---|---|---|"
            for f in trivy-fs.json trivy-image.json; do
              [ -f "$f" ] || continue
              v=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$f")
              s=$(jq '[.Results[]?.Secrets[]?] | length' "$f")
              m=$(jq '[.Results[]?.Misconfigurations[]?] | length' "$f")
              echo "| \`$f\` | $v | $s | $m |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          for f in trivy-fs.json trivy-image.json; do
            [ -f "$f" ] || continue
            echo "== $f =="
            jq -r '.Results[]? as $r
              | ($r.Vulnerabilities[]? | "\($r.Target): \(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) → \(.FixedVersion // "-")"),
                ($r.Secrets[]? | "\($r.Target): \(.Severity) SEGRETO \(.RuleID) riga \(.StartLine)"),
                ($r.Misconfigurations[]? | "\($r.Target): \(.Severity) \(.ID) \(.Title)")' "$f"
          done

      - id: n
        if: always()
        env: { P: "${{ inputs.path }}" }
        run: echo "name=$(basename "$P")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-${{ steps.n.outputs.name }}
          path: trivy-*.json
          retention-days: 90
          if-no-files-found: ignore
