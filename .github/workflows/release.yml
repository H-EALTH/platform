# release — valida il tag <prodotto>-vX.Y.Z, risolve il digest di ogni componente dal registry,
# aggiunge il tag di rilascio a ciascun artefatto, genera SBOM per le immagini e crea la Release
# con la lista dei digest nelle note e allegata. Non costruisce e non ripubblica nulla (ADR 0001, 0002).
# Il prodotto lo chiama da un workflow con `on: push: tags: ['*-v*']`.
# Il tag può nascere da riga di comando (la Release la crea questo workflow) oppure dalla UI web
# "Create a new release" (la Release esiste già: il workflow la completa con digest e allegati).
# I digest si risolvono dal tag `sha-<short>` del commit taggato: se un componente manca,
# quel commit non è passato dalla CI di main e il rilascio si ferma.
name: release
on:
  workflow_call:
    inputs:
      product: { type: string, required: true }   # prefisso del tag, es. monitor-letto
      refs:    { type: string, required: true }   # un componente per riga: ghcr.io/h-ealth/<prodotto>/<componente>

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: "Il tag deve essere <prodotto>-v<major>.<minor>.<patch>"
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          re="^${PRODUCT}-v[0-9]+\.[0-9]+\.[0-9]+$"
          echo "$GITHUB_REF_NAME" | grep -Eq "$re" \
            || { echo "::error::tag '$GITHUB_REF_NAME' non conforme a $re"; exit 1; }

  resolve:
    needs: validate
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d   # v2.0.1
        with: { version: 1.3.0 }   # la più recente conosciuta da setup-oras v1.2.4 (lista con checksum interna)
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26   # v0.24.2
        with: { syft-version: v1.51.1 }

      - name: "Login GHCR con il token del run (ADR 0002)"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: "Risolvi sha-<short> in digest e aggiungi il tag di rilascio"
        env:
          REFS: ${{ inputs.refs }}
        run: |
          short="${GITHUB_SHA::7}"
          : > artifacts.txt
          while read -r ref; do
            [ -z "$ref" ] && continue
            digest=$(oras resolve "${ref}:sha-${short}") \
              || { echo "::error::${ref}:sha-${short} non esiste: il commit taggato non è passato dalla CI"; exit 1; }
            oras tag "${ref}@${digest}" "$GITHUB_REF_NAME"   # ADR 0002: il tag si aggiunge, l'identità resta il digest
            echo "${ref}@${digest}" >> artifacts.txt
          done <<< "$REFS"
          { echo "### ${GITHUB_REF_NAME}"; sed 's/^/- `/; s/$/`/' artifacts.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: "SBOM delle sole immagini container"
        run: |
          mkdir -p sbom
          while read -r art; do
            # un artefatto pubblicato con oras ha artifactType; un'immagine Docker no
            if [ -n "$(oras manifest fetch "$art" | jq -r '.artifactType // empty')" ]; then continue; fi
            name=$(basename "${art%%@*}")
            syft "registry:${art}" -o spdx-json > "sbom/${name}.spdx.json"
          done < artifacts.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: |
            artifacts.txt
            sbom/
          retention-days: 90

  release:
    needs: resolve
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.sha }}
      - name: "Crea o completa la Release: digest nelle note, artifacts.txt e SBOM allegati"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="artifacts.txt $(ls sbom/*.spdx.json 2>/dev/null || true)"
          { echo "## Artefatti (ADR 0001: il prodotto è la lista dei digest)"; sed 's/^/- `/; s/$/`/' artifacts.txt; } > artefatti.md

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release già esistente (creata dalla UI web): la completo"
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > note.md
            printf '\n\n' >> note.md; cat artefatti.md >> note.md
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file note.md
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber $files \
              || echo "::warning::allegati non caricati (Release immutabile?): restano tra gli artifact del run per 90 giorni"
          else
            echo "Nessuna Release: la creo dal tag"
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes --notes-file artefatti.md $files
          fi
