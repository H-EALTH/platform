# build-image — costruisce l'immagine container di UN componente, la pubblica su GHCR
# e restituisce il digest. È il gemello di `publish` per i container: Docker pubblica già
# su OCI con digest, quindi non passa da oras, ma rispetta lo stesso contratto (ADR 0001).
# Tag: solo `sha-<short>`; il tag di rilascio lo aggiunge `release` (ADR 0002).
# Il context di default è la radice del repo: i Dockerfile copiano anche libs/ condivise.
# Pinning delle action: ADR 0003.
name: build-image
on:
  workflow_call:
    inputs:
      path:       { type: string, required: true }   # cartella del componente, es. services/api
      image:      { type: string, required: true }   # es. ghcr.io/h-ealth/<prodotto>/<componente>
      context:    { type: string, default: "." }
      dockerfile: { type: string, default: "" }      # default: <path>/Dockerfile
    outputs:
      digest:
        description: "sha256:... dell'immagine pubblicata"
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: type=sha,prefix=sha-
          labels: |
            h-ealth.run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e   # v4.3.0

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a   # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.path) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest nel summary del run
        env:
          IMAGE:  ${{ inputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### build-image"
            echo "**${IMAGE}** → \`${DIGEST}\`"
            echo "tag: \`sha-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
