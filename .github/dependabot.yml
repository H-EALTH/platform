# Dependabot tiene aggiornati i `uses:` dei workflow di platform (ADR 0003):
# le action GitHub-owned al tag maggiore, quelle di terze parti allo SHA (il commento # vX.Y.Z
# accanto allo SHA è ciò che gli permette di riconoscere la versione).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]   # una sola PR settimanale con tutti gli aggiornamenti
