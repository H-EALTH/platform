server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: ogni path sconosciuto torna a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy verso l'API interna: adatta nome servizio e porta al compose del prodotto
    location /api/ {
        proxy_pass http://<nome-servizio>:8000/;
    }
}
